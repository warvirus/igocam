services:
  igocam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igocam
    network_mode: host
    volumes:
      # 카메라 설정 파일 (호스트에서 수정 가능)
      - ./camera_config.json:/app/camera_config.json:ro
      # 비디오 파일이 있는 디렉터리 (camera_config.json의 source 경로와 일치)
      - /path/to/your/videos:/videos:ro
      # 녹화 파일 저장 경로
      - ./recordings:/app/recordings
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped